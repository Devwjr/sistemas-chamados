services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suporte
      POSTGRES_USER: ${DB_USERNAME:-suporte}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d suporte"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/suporte
      DB_USERNAME: ${DB_USERNAME:-suporte}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@empresa.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Defina a senha inicial do administrador}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
volumes:
  postgres_data:
