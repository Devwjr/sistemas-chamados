name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      DB_URL: jdbc:postgresql://localhost:5432/suporte
      DB_USERNAME: nucleo
      DB_PASSWORD: ci-test-only-password
      BOOTSTRAP_ADMIN_EMAIL: admin@empresa.local
      BOOTSTRAP_ADMIN_PASSWORD: ci-test-only-password
      COOKIE_SECURE: 'false'
      RUN_POSTGRES_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-17
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE nucleo LOGIN PASSWORD 'ci-test-only-password'"
          sudo -u postgres psql -c "CREATE DATABASE suporte OWNER nucleo"
      - name: Test backend
        run: |
          if ./mvnw -B test > backend-test.log 2>&1; then
            cat backend-test.log
          else
            cat backend-test.log
            {
              echo '## Backend test failure'
              echo '```text'
              tail -n 180 backend-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        working-directory: backend
      - name: Test backup and restore scripts
        run: bash deploy/tests/backup-scripts.test.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend
        run: npm test
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
